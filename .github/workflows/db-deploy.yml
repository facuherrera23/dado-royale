name: Deploy DB (migraciones)

# Aplica supabase/migrations al proyecto real cuando cambian.
# REQUIERE secrets: SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/db-deploy.yml']
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verificar CI (los tests SQL pasan localmente en ci.yml)
        run: echo "Las migraciones de esta rama ya pasaron pgTAP en el job db-tests de CI"

      - name: Aplicar migraciones al proyecto cjalkhrmuxndrozcwcmo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref cjalkhrmuxndrozcwcmo --password "$SUPABASE_DB_PASSWORD"
          supabase db push
