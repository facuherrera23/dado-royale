name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      # Levanta el stack local (Docker ya viene en ubuntu-latest) y aplica migraciones
      - run: supabase start
      - name: Tests de base de datos (pgTAP)
        run: supabase test db

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Typecheck + build
        env:
          # Valores dummy: suficientes para compilar; las claves reales
          # solo se usan en el deploy (GitHub Secrets).
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
        run: npm run build

      - name: Tests
        run: npm test -- --run
